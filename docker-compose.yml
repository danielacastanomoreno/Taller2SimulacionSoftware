services:
  backend:
    build:
      context: ./mi-backend
      dockerfile: Dockerfile
    image: taller2-backend:latest
    container_name: taller2-backend
    restart: unless-stopped
    environment:
      PORT: 3000
    volumes:
      - backend-history:/app/data
    expose:
      - "3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: taller2-frontend:latest
    container_name: taller2-frontend
    restart: unless-stopped
    environment:
      PORT: 8080
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      - backend
    expose:
      - "8080"

  nginx:
    image: nginx:1.27-alpine
    container_name: taller2-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  backend-history:

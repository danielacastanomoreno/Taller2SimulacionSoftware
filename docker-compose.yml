services:
  backend:
    build:
      context: ./mi-backend
      dockerfile: Dockerfile
    container_name: container-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - backend-history:/app/data


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: container-frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: taller2-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  backend-history:

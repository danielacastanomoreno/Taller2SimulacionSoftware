# ==========================================
# GitHub Action Test - Docker Container Reverse Proxy
# URL: /iaslab/ingesoftV/dasaescafa-calculator-docker/
# ==========================================

location = /iaslab/ingesoftV/dasaescafa-calculator-docker {
    return 301 /iaslab/ingesoftV/dasaescafa-calculator-docker/$is_args$args;
}

location /iaslab/ingesoftVdasaescafa-calculator-docker/ {
    # Si le pongo ; significa que le hago una redireccion completa.
    # Si le pongo /; significa que tome el slash y despues puedo poner mas cosas a la ruta.
    proxy_pass http://127.0.0.1:9088/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "upgrade";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Un proxy inverso es un tipo de servidor proxy que recupera recursos en 
# nombre del cliente externo, desde una o mas servidores internos
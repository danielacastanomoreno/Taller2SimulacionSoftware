name: Deploy Web App

on:
  push:
    branches:
      - deploySantiago
  workflow_dispatch:

jobs:
  deploy:
    name: Web App Deployment
    runs-on: [self-hosted]
    if: github.ref == 'refs/heads/deploySantiago' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Diagnostics & Environment Info
        run: |
          echo "=========================================="
          echo "  Modo: Despliegue Web App con Docker"
          echo "  Rama: ${{ github.ref_name }}"
          echo "  Host: $(hostname)"
          echo "  Usuario: $(whoami)"
          echo "  Directorio: $(pwd)"
          echo "  Fecha: $(date)"
          echo "=========================================="
          docker --version
          docker compose version

      - name: Verify Project Files
        run: |
          test -f docker-compose.yml
          test -f scripts/deploy.sh
          test -f nginx/default.conf
          test -f frontend/Dockerfile
          test -f mi-backend/Dockerfile
          echo "Archivos de despliegue verificados."

      - name: Deploy App
        run: |
          bash scripts/deploy.sh

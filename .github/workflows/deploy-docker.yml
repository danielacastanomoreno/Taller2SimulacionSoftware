# El workflow esta pendiente de los eventos.
# Busca si existe los .yml que tiene los pipelines.

# Los runner son los encargados de correr los workflows.
# El runner revisa si hay eventos asociados, lo baja y lo corre. Hace como un 
# pull

name: Deploy with Docker (Fixes Branch)

on:
  push:
    branches:
      - Fixes
  workflow_dispatch:

jobs:
  deploy-docker:
    name: Docker Container Deployment on IASLAB Computer
    runs-on: [ self-hosted ]
    if: github.ref == 'refs/heads/docker' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Diagnostics & Environment Info
        run: |
          echo "=========================================="
          echo "  Modo: Despliegue con Docker (Rama Fixes)"
          echo "  Host: $(hostname)"
          echo "  Usuario: $(whoami)"
          echo "  Directorio: $(pwd)"
          echo "  Fecha: $(date)"
          echo "=========================================="
          docker --version
          docker compose version

      - name: Build & Run Docker Container
        run: |
          echo "Construyendo y levantando contenedor Docker..."
          docker compose down --remove-orphans || true
          docker compose build --no-cache
          docker compose up -d --force-recreate
          echo "Contenedor iniciado exitosamente:"
          docker ps --filter "name=mi-backend"
          docker ps --filter "name=frontend"

      - name: Deploy Nginx Reverse Proxy Config
        run: |
          DEST_DIR="/home/iaslab/ingesoftV/dasaescafa-calculator-docker"
          mkdir -p "$DEST_DIR"
          cp nginx.conf "$DEST_DIR/nginx.conf"
          chmod -R 755 "$DEST_DIR"
          echo "Configuracion de Nginx copiada a $DEST_DIR/nginx.conf"

      - name: Test & Reload Nginx
        run: |
          sudo nginx -t
          sudo systemctl reload nginx
          echo "Nginx recargado exitosamente con proxy hacia el contenedor Docker."

      - name: Container Healthcheck
        run: |
          sleep 2
          curl -sI http://127.0.0.1:9088/ | head -n 5
          echo "Contenedor respondiendo correctamente en puerto 9088."